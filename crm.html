<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM后台 · NexaArtistry AI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <div class="container page-header-row">
        <div>
          <p class="eyebrow">CRM 后台</p>
          <h1>客户运营中心</h1>
          <p class="lead">实时查看线索来源、跟进状态与成交进度。</p>
        </div>
        <a class="btn btn-secondary" href="/">返回官网</a>
      </div>
    </header>

    <main class="container dashboard">
      <section class="stats-grid">
        <div class="stat-card">
          <h3>新增线索</h3>
          <p>24</p>
        </div>
        <div class="stat-card">
          <h3>待跟进</h3>
          <p>8</p>
        </div>
        <div class="stat-card">
          <h3>已报价</h3>
          <p>12</p>
        </div>
        <div class="stat-card">
          <h3>成交数</h3>
          <p>5</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>近期客户</h2>
          <span class="tag">今日更新</span>
        </div>
        <table>
          <thead>
            <tr>
              <th>客户</th>
              <th>联系信息</th>
              <th>状态</th>
              <th>备注</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>张先生</td>
              <td>138****1234</td>
              <td>待跟进</td>
              <td>咨询品牌官网方案</td>
            </tr>
            <tr>
              <td>李女士</td>
              <td>hello@demo.com</td>
              <td>已报价</td>
              <td>等待确认方案</td>
            </tr>
            <tr>
              <td>王总</td>
              <td>139****4567</td>
              <td>已成交</td>
              <td>签约成功</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
